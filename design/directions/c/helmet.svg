<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Legionary helmet: original avatar for auspex direction C</title>
<defs>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#D8DBDF"/>
    <stop offset="0.45" stop-color="#A3A9B1"/>
    <stop offset="1" stop-color="#535A64"/>
  </linearGradient>
  <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#848B95"/>
    <stop offset="1" stop-color="#2A2E34"/>
  </linearGradient>
  <linearGradient id="crest" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EA4D55"/>
    <stop offset="1" stop-color="#8E161C"/>
  </linearGradient>
  <clipPath id="crestClip"><path d="M26,66 C30,22 170,22 174,66 L160,70 C150,44 50,44 40,70 Z"/></clipPath>
  <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>
</defs>
<!-- transverse crest seen from the front -->
<path d="M26,66 C30,22 170,22 174,66 L160,70 C150,44 50,44 40,70 Z" fill="url(#crest)"/>
<g stroke="#8E161C" stroke-width="1.6" opacity="0.8" clip-path="url(#crestClip)">
  <line x1="40" y1="60" x2="36" y2="44"/><line x1="56" y1="50" x2="54" y2="34"/>
  <line x1="72" y1="45" x2="71" y2="29"/><line x1="88" y1="43" x2="88" y2="26"/>
  <line x1="104" y1="43" x2="104" y2="26"/><line x1="120" y1="44" x2="121" y2="27"/>
  <line x1="136" y1="47" x2="138" y2="31"/><line x1="152" y1="53" x2="155" y2="38"/>
</g>
<!-- neck guard flare behind -->
<polygon points="38,98 162,98 174,120 26,120" fill="url(#steelDark)"/>
<!-- dome -->
<path d="M48,102 C46,52 154,52 152,102 Z" fill="url(#steel)"/>
<path d="M100,56 L100,100" stroke="#535A64" stroke-width="2"/>
<!-- brow ridge -->
<polygon points="44,98 156,98 154,108 46,108" fill="#848B95"/>
<polygon points="44,98 156,98 155,101 45,101" fill="#D8DBDF" opacity="0.7"/>
<!-- face opening -->
<polygon points="68,108 132,108 128,172 112,180 88,180 72,172" fill="#07080A"/>
<!-- visor line -->
<line x1="75" y1="128" x2="125" y2="128" stroke="#EA4D55" stroke-width="5" filter="url(#glow)" opacity="0.8"/>
<line x1="75" y1="128" x2="125" y2="128" stroke="#FF6A6F" stroke-width="2"/>
<!-- cheek guards -->
<polygon points="46,108 70,108 75,170 62,186 46,154" fill="url(#steel)"/>
<polygon points="154,108 130,108 125,170 138,186 154,154" fill="url(#steelDark)"/>
<g fill="#C9A24A">
  <circle cx="58" cy="120" r="2.4"/><circle cx="62" cy="168" r="2.4"/>
  <circle cx="142" cy="120" r="2.4"/><circle cx="138" cy="168" r="2.4"/>
</g>
</svg>
